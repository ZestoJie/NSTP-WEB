<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GrowSauYou | Log In</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body class="pageLogin">
  <div class="app-shell">
    <header class="topbar">
      <div class="brand">
        <img class="brandMarkImage" src="Resources/SYSTEM-WIDE LOGO.png" alt="GrowSauYou logo">
        <span class="brandName">GrowSauYou</span>
      </div>
      <div class="topbar-right">
        <span class="hotline">BRGY SAUYO HOTLINE: 0919 096 6996</span>
        <div class="socials" aria-label="Social links">
          <a href="#" aria-label="Instagram" class="social-icon">ig</a>
          <a href="#" aria-label="Facebook" class="social-icon">f</a>
        </div>
      </div>
    </header>

    <main class="pageShell">
      <div class="formPage loginLayout">
        <a class="backLink" href="welcomePage.html">
          <span class="arrow">&larr;</span>
          <span class="miniBrand">GrowSauYOU</span>
        </a>

        <div class="pageTitle compact">
          <h2>Log In</h2>
          <p>Get notified and stay updated</p>
        </div>

        <form class="softPanel formPanel loginPanel">
          <div class="fieldRow">
            <input type="email" placeholder="Gmail">
          </div>
          <div class="fieldRow submitRow">
            <a class="wideBtn actionLink" href="dashboard.html">LOG IN</a>
          </div>
        </form>
      </div>
    </main>
  </div>
</body>
</html>
