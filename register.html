<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GrowSauYou | Register</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body class="pageRegister">
  <div class="app-shell">
    <header class="topbar">
      <div class="brand">
        <img class="brandMarkImage" src="Resources/SYSTEM-WIDE LOGO.png" alt="GrowSauYou logo">
        <span class="brandName">GrowSauYou</span>
      </div>
      <div class="topbar-right">
        <span class="hotline">BRGY SAUYO HOTLINE: 0919 096 6996</span>
        <div class="socials" aria-label="Social links">
          <a href="#" aria-label="Instagram" class="social-icon">ig</a>
          <a href="#" aria-label="Facebook" class="social-icon">f</a>
        </div>
      </div>
    </header>

    <main class="pageShell">
      <div class="formPage">
        <a class="backLink" href="welcomePage.html">
          <span class="arrow">&larr;</span>
          <span class="miniBrand">GrowSauYOU</span>
        </a>

        <div class="pageTitle">
          <h2>Volunteer Registration</h2>
          <p>Sign up to help our community thrive.</p>
        </div>

        <form class="softPanel formPanel">
          <div class="fieldRow split21">
            <input type="text" placeholder="Full name">
            <input type="number" placeholder="Age">
          </div>
          <div class="fieldRow">
            <input type="text" placeholder="Address">
          </div>
          <div class="fieldRow split11">
            <input type="email" placeholder="Gmail">
            <input type="tel" placeholder="Cellphone Number">
          </div>
          <div class="fieldRow selectWrap">
            <select>
              <option selected disabled>Select Skill Category</option>
              <option>Urban Gardening</option>
              <option>Community Outreach</option>
              <option>Waste Management</option>
              <option>Construction Support</option>
            </select>
          </div>
          <div class="fieldRow">
            <textarea rows="4" placeholder="Other Specific Skills"></textarea>
          </div>
          <div class="fieldRow submitRow">
            <a class="wideBtn actionLink" href="dashboard.html">REGISTER NOW</a>
          </div>
        </form>
      </div>
    </main>
  </div>
</body>
</html>
