<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GrowSauYou | Welcome</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
  <link rel="stylesheet" href="welcomePage.css">
</head>
<body class="pageWelcome">
  <div class="app-shell">
    <header class="topbar">
      <div class="brand">
        <img class="brandMarkImage" src="Resources/SYSTEM-WIDE LOGO.png" alt="GrowSauYou logo">
        <span class="brandName wordmark">
          <span>GrowSauYOU</span>
        </span>
      </div>
      <div class="topbar-right">
        <span class="hotline">BRGY SAUYO HOTLINE: 0919 096 6996</span>
        <div class="socials" aria-label="Social links">
          <a href="#" aria-label="Instagram" class="social-icon">ig</a>
          <a href="#" aria-label="Facebook" class="social-icon">f</a>
        </div>
      </div>
    </header>

    <main class="pageShell welcomeShell">
      <section class="homeHero">
        <div class="heroLogo" aria-hidden="true">
          <img class="heroLogoImage" src="Resources/SYSTEM-WIDE LOGO.png" alt="GrowSauYou logo">
          <div>
            <h1 class="heroTitle wordmark">
              <span>GrowSauYOU</span>
            </h1>
            <p>Growth starts with you</p>
          </div>
        </div>

        <div class="gallery">
          <article class="galleryCard nature1" style="background-image:url('https://images.unsplash.com/photo-1502082553048-f009c37129b9')"></article>
          <article class="galleryCard nature2" style="background-image:url('https://images.unsplash.com/photo-1464226184884-fa280b87c399')"></article>
          <article class="galleryCard nature3" style="background-image:url('https://images.unsplash.com/photo-1492496913980-501348b61469')"></article>
        </div>

        <div class="heroActions">
          <a class="actionBtn actionLink" href="register.html">Register</a>
          <a class="actionBtn actionLink" href="login.html">Log In</a>
        </div>

        <p class="heroCopy">
          Join our community initiative to build a greener, stronger, and more resilient barangay together.
          Your hands can shape the future of our neighborhood.
        </p>
      </section>
    </main>
  </div>
</body>
</html>
